  <line x1="46" y1="64" x2="66" y2="64" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="72" x2="62" y2="72" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <!-- Falcon Hood Head -->
