<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Donut Dough -->
  <circle cx="50" cy="50" r="38" fill="#e0a96d" stroke="#b27b3b" stroke-width="2" />
  <circle cx="50" cy="50" r="14" fill="#ffffff" stroke="#b27b3b" stroke-width="2" />

  <!-- Strawberry Icing -->
  <path d="M50,15 
           C65,15 84,28 84,48 
           C84,62 78,72 70,78 
           C63,83 55,79 50,83 
           C45,87 36,83 30,79 
           C22,73 16,61 16,48 
           C16,28 35,15 50,15 Z" 
        fill="#f48fb1" />

  <!-- Inner icing ring cutout -->
  <circle cx="50" cy="50" r="14" fill="#ffffff" stroke="#b27b3b" stroke-width="2" />

  <!-- Colorful Sprinkles -->
  <!-- Blue -->
  <rect x="35" y="25" width="8" height="3" rx="1.5" transform="rotate(25 35 25)" fill="#4fc3f7" />
  <rect x="68" y="55" width="8" height="3" rx="1.5" transform="rotate(-35 68 55)" fill="#4fc3f7" />
  <rect x="42" y="74" width="8" height="3" rx="1.5" transform="rotate(45 42 74)" fill="#4fc3f7" />
  <!-- Yellow -->
  <rect x="58" y="22" width="8" height="3" rx="1.5" transform="rotate(-15 58 22)" fill="#ffee58" />
  <rect x="25" y="45" width="8" height="3" rx="1.5" transform="rotate(80 25 45)" fill="#ffee58" />
  <rect x="62" y="70" width="8" height="3" rx="1.5" transform="rotate(10 62 70)" fill="#ffee58" />
  <!-- White -->
  <rect x="46" y="32" width="7" height="3" rx="1.5" transform="rotate(40 46 32)" fill="#ffffff" />
  <rect x="73" y="40" width="7" height="3" rx="1.5" transform="rotate(-60 73 40)" fill="#ffffff" />
  <rect x="26" y="62" width="7" height="3" rx="1.5" transform="rotate(30 26 62)" fill="#ffffff" />
  <!-- Green -->
  <rect x="28" y="32" width="8" height="3" rx="1.5" transform="rotate(-40 28 32)" fill="#81c784" />
  <rect x="53" y="68" width="8" height="3" rx="1.5" transform="rotate(-20 53 68)" fill="#81c784" />
</svg>
