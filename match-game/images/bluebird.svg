<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Perch Branch -->
  <line x1="16" y1="84" x2="84" y2="84" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
  <!-- Little Feet -->
  <circle cx="45" cy="82" r="2.5" fill="#f59e0b"/>
  <circle cx="55" cy="82" r="2.5" fill="#f59e0b"/>
  <!-- Blue Body & Tail -->
  <path d="M52 64 L74 86 L62 88 Z" fill="#1d4ed8"/>
  <ellipse cx="46" cy="56" rx="16" ry="18" fill="#3b82f6"/>
  <!-- Warm Orange/Rust Breast (Eastern Bluebird) -->
  <path d="M36 50 C32 60, 36 72, 48 72 C46 62, 42 52, 36 50 Z" fill="#ea580c"/>
  <!-- Head & Beak -->
  <circle cx="38" cy="36" r="14" fill="#3b82f6"/>
  <circle cx="34" cy="34" r="2.5" fill="#0f172a"/>
  <circle cx="35" cy="33" r="1" fill="#ffffff"/>
  <!-- Short Seed Beak -->
  <polygon points="26,38 18,40 26,43" fill="#f59e0b"/>
