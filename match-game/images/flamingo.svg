<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Water ripples -->
  <ellipse cx="50" cy="90" rx="36" ry="6" fill="#38bdf8" opacity="0.4"/>
  <!-- Long Legs (one straight, one bent) -->
  <line x1="52" y1="62" x2="52" y2="90" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
  <polyline points="48,62 40,74 50,74" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
  <!-- Oval Pink Body -->
  <ellipse cx="52" cy="52" rx="18" ry="12" fill="#ec4899"/>
  <!-- Wing Feather overlay -->
  <path d="M42 46 Q32 54, 46 62 Q58 54, 52 46 Z" fill="#db2777"/>
  <!-- S-Curved Elegant Neck -->
  <path d="M64 48 C72 40, 70 20, 56 16 C48 14, 46 22, 52 26" fill="none" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
  <!-- Head & Eye -->
  <circle cx="50" cy="22" r="7" fill="#ec4899"/>
  <circle cx="50" cy="20" r="1.5" fill="#0f172a"/>
  <!-- Downward Hooked Beak -->
  <path d="M46 22 L36 26 C35 34, 42 32, 44 26 Z" fill="#fbcfe8"/>
  <path d="M38 25 L34 27 C34 32, 38 31, 39 27 Z" fill="#0f172a"/>
</svg>
