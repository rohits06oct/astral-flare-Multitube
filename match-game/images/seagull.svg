<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Wooden Pier Post -->
  <path d="M40 76 L40 96 L60 96 L60 76 Z" fill="#a16207"/>
  <ellipse cx="50" cy="76" rx="10" ry="3.5" fill="#ca8a04"/>
  <!-- Seagull Feet -->
  <path d="M45 74 L45 70 M55 74 L55 70" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Seagull Body -->
  <path d="M38 52 C34 64, 46 72, 62 70 C72 68, 76 56, 68 50 C58 44, 42 46, 38 52 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <!-- Grey Folded Wing -->
  <path d="M46 50 C58 48, 74 54, 82 66 C76 66, 60 62, 50 56 Z" fill="#94a3b8"/>
  <polygon points="76,64 86,68 80,62" fill="#0f172a"/>
  <!-- Head & Neck -->
  <path d="M38 52 C36 44, 40 34, 46 26 C52 24, 56 28, 54 36 C52 44, 48 50, 46 54 Z" fill="#ffffff"/>
  <circle cx="48" cy="28" r="8" fill="#ffffff"/>
  <!-- Beady Eye -->
  <circle cx="45" cy="26" r="2.2" fill="#facc15"/>
  <circle cx="45" cy="26" r="1.2" fill="#0f172a"/>
  <!-- Yellow Beak with Red Spot -->
  <polygon points="41,27 24,31 41,34" fill="#eab308"/>
  <circle cx="30" cy="32" r="1.5" fill="#ef4444"/>
</svg>
