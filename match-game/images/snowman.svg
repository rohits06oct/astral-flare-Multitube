<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Snow ground patch -->
  <ellipse cx="50" cy="88" rx="35" ry="7" fill="#ffffff" opacity="0.9" />

  <!-- Snowman body -->
  <circle cx="50" cy="72" r="18" fill="#ffffff" stroke="#cdd9e5" stroke-width="1.5" />
  <circle cx="50" cy="46" r="13" fill="#ffffff" stroke="#cdd9e5" stroke-width="1.5" />
  
  <!-- Buttons -->
  <circle cx="50" cy="65" r="1.8" fill="#2c3e50" />
  <circle cx="50" cy="72" r="1.8" fill="#2c3e50" />
  <circle cx="50" cy="79" r="1.8" fill="#2c3e50" />

  <!-- Twig arms -->
  <path d="M37,48 L22,42 M27,44 L25,38 M25,43 L22,46" stroke="#5d4037" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M63,48 L78,42 M73,44 L75,38 M75,43 L78,46" stroke="#5d4037" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Face -->
  <!-- Eyes -->
  <circle cx="45" cy="43" r="1.8" fill="#222" />
  <circle cx="55" cy="43" r="1.8" fill="#222" />
  <!-- Carrot nose -->
  <polygon points="50,45 50,49 41,48" fill="#ff7043" />
  <!-- Coal smile -->
  <circle cx="44" cy="51" r="0.9" fill="#222" />
  <circle cx="47" cy="53" r="0.9" fill="#222" />
  <circle cx="50" cy="53.5" r="0.9" fill="#222" />
  <circle cx="53" cy="53" r="0.9" fill="#222" />
  <circle cx="56" cy="51" r="0.9" fill="#222" />

  <!-- Hat -->
