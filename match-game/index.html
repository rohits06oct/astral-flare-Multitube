  <title>Line Matching Game - Quiz Puzzle</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- =========================================================
       GAME LOADER SCREEN: "gametanieshak" FLOATING STYLE
       ========================================================= -->
  <div id="game-loader-screen" class="game-loader-screen active" aria-live="polite">
    <div class="loader-backdrop-effects">
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
      <div class="glow-orb orb-3"></div>
      <div class="floating-grid-mesh"></div>
    </div>

    <div class="loader-content">
      <!-- Matching Word Chips (looks like matching all words) -->
      <!-- <div class="matching-words-pills">
        <div class="word-chip chip-game">
          <span class="chip-dot"></span>
          <span>game</span>
        </div>
        <div class="chip-connector-line">
          <span class="connector-pulse"></span>
        </div>
        <div class="word-chip chip-tanie">
          <span class="chip-dot"></span>
          <span>tanie</span>
        </div>
        <div class="chip-connector-line">
          <span class="connector-pulse"></span>
        </div>
        <div class="word-chip chip-shak">
          <span class="chip-dot"></span>
          <span>shak</span>
        </div>
      </div> -->

      <!-- Main Floating "gametanieshak" Display in Floating Style -->
      <div class="brand-floating-title" aria-label="gametanieshak">
        <span class="float-char" style="--ci: 0">g</span>
        <span class="float-char" style="--ci: 1">a</span>
        <span class="float-char" style="--ci: 2">m</span>
        <span class="float-char" style="--ci: 3">e</span>
        <span class="float-char accent-mid" style="--ci: 4">t</span>
        <span class="float-char accent-mid" style="--ci: 5">a</span>
        <span class="float-char accent-mid" style="--ci: 6">n</span>
        <span class="float-char accent-mid" style="--ci: 7">i</span>
        <span class="float-char accent-mid" style="--ci: 8">e</span>
        <span class="float-char accent-end" style="--ci: 9">s</span>
        <span class="float-char accent-end" style="--ci: 10">h</span>
        <span class="float-char accent-end" style="--ci: 11">a</span>
        <span class="float-char accent-end" style="--ci: 12">k</span>
      </div>

      <!-- Floating Sparkles & Match Tag -->
      <div class="loader-tagline">
        <span class="sparkle-icon">✨</span>
        <span id="loader-status-text">Matching Words & Puzzles...</span>
        <span class="sparkle-icon">✨</span>
      </div>

      <!-- Dynamic Progress Bar -->
      <div class="loader-progress-track">
        <div id="loader-progress-bar" class="loader-progress-bar">
          <span class="progress-glow-head"></span>
        </div>
      </div>

      <div class="loader-stats">
        <span class="loading-label">LOADING</span>
        <span id="loader-percent-num" class="loading-percent">0%</span>
      </div>
    </div>
  </div>

  <div class="game-viewport">
    <main class="game-container">

      <!-- =========================================================
           SCREEN 1: 3D LEVEL SELECTION SCREEN (Before actual level starts)
           ========================================================= -->
      <section id="level-select-screen" class="level-select-screen">
        <!-- Top Navigation Bar -->
        <header class="level-select-header">
          <div class="level-select-brand-chip">
            <span class="brand-chip-sparkle">✨</span>
            <span class="brand-chip-title">MATCH QUIZ</span>
          </div>

          <div class="level-select-header-actions">
            <button id="btn-close-level-select" class="header-btn btn-close-game" aria-label="Close Game"
              title="Close / Exit Game">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="18" y1="6" x2="6" y2="18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                </line>
                <line x1="6" y1="6" x2="18" y2="18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                </line>
              </svg>
            </button>
          </div>
        </header>

        <!-- Main Scrollable Selection Body -->
        <div class="level-select-body">
          <div class="level-select-banner">
            <div class="level-select-pill">🎮 3D ADVENTURE</div>
            <h1 class="level-select-title">Select Level</h1>
            <p class="level-select-desc">Tap any level below to start playing!</p>
          </div>

          <!-- 3D Level Cards Container -->
          <div class="level-cards-grid" id="level-cards-grid">
            <!-- Dynamically populated 3D Level Cards 1 through 5 -->
          </div>
        </div>

        <!-- Footer Branding -->
        <footer class="level-select-footer">
          <div class="footer-brand-logo">
            <span class="brand-logo-symbol">🎮</span>
            <span class="brand-logo-text">GameTanieshak</span>
          </div>
        </footer>
      </section>

      <!-- =========================================================
           SCREEN 2: ACTIVE GAMEPLAY VIEW (Starts once level is selected)
           ========================================================= -->
      <div id="gameplay-view" class="gameplay-view" style="display: none;">
        <!-- Top Navigation Bar -->
        <header class="game-header">
          <!-- Pause & Levels Button Group (Left) -->
          <div class="header-group-left">
            <button id="btn-pause" class="header-btn" aria-label="Pause Game" title="Pause / Menu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="8" y1="5" x2="8" y2="19" stroke-linecap="round"></line>
                <line x1="16" y1="5" x2="16" y2="19" stroke-linecap="round"></line>
              </svg>
            </button>
            <button id="btn-back-to-levels" class="header-btn" aria-label="Choose Level"
              title="Select Level / All Levels">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <rect x="3" y="3" width="7" height="7" rx="1.5" stroke-width="2"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1.5" stroke-width="2"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1.5" stroke-width="2"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1.5" stroke-width="2"></rect>
              </svg>
            </button>
          </div>

          <!-- Quiz Pill Badge (Center - clickable to switch levels) -->
          <div class="level-badge" id="level-badge-clickable" title="Click to choose another level">
            <span id="level-badge-text" class="level-badge-text">Quiz 1</span>
          </div>

          <!-- Action Buttons Group (Right: Restart & Close/Exit) -->
          <div class="header-group-right">
            <button id="btn-restart" class="header-btn" aria-label="Restart Level" title="Restart">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M20 11 A8 8 0 1 0 18.3 16.5" stroke-linecap="round"></path>
                <polyline points="20 5 20 11 14 11" stroke-linecap="round" stroke-linejoin="round"></polyline>
              </svg>
            </button>
            <button id="btn-close-game" class="header-btn btn-close-game" aria-label="Close Game"
              title="Close / Exit Game">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="18" y1="6" x2="6" y2="18" stroke-linecap="round" stroke-linejoin="round"></line>
                <line x1="6" y1="6" x2="18" y2="18" stroke-linecap="round" stroke-linejoin="round"></line>
              </svg>
            </button>
          </div>
        </header>

        <!-- Target Order / Instruction Hint Bar -->
        <div id="order-indicator" class="order-indicator">
          <!-- Populated dynamically based on required matching order -->
        </div>

        <!-- Main Game Play Area with SVG Canvas Overlay -->
        <section class="game-play-area">
          <!-- SVG Line Overlay -->
          <svg id="connection-svg" class="connection-svg"></svg>

          <!-- Left Items Column -->
          <div id="left-column" class="column-items column-left"></div>

          <!-- Right Items Column -->
          <div id="right-column" class="column-items column-right"></div>
        </section>

        <!-- Bottom Branding Bar with GameTanieshak Logo -->
        <footer class="game-footer">
          <div class="footer-brand-logo">
            <span class="brand-logo-symbol">🎮</span>
            <span class="brand-logo-text">GameTanieshak</span>
          </div>
        </footer>
      </div>

      <!-- Toast Feedback Message -->
      <div id="toast-msg" class="toast-msg"></div>

      <!-- Confetti Particles Canvas -->
      <canvas id="confetti-canvas"></canvas>

      <!-- =========================================================
           MODAL 1: CONGRATULATIONS / NEXT LEVEL POPUP
           ========================================================= -->
      <div id="victory-modal" class="modal-overlay">
        <div class="modal-card">
          <div class="victory-icon-wrap">🌟</div>
          <h2 id="victory-title" class="victory-title">Congratulations!</h2>
          <p id="victory-subtitle" class="victory-subtitle">You matched all items in perfect sequence!</p>
          <div class="stars-rating">⭐⭐⭐</div>
          <button id="btn-next-level" class="btn-primary">Next Level →</button>
          <button id="btn-victory-levels" class="btn-secondary">▦ Choose Level</button>
          <button id="btn-replay-level" class="btn-secondary">Replay Level ↺</button>
        </div>
      </div>

      <!-- =========================================================
           MODAL 2: PAUSE / SETTINGS MODAL
           ========================================================= -->
      <div id="pause-modal" class="modal-overlay">
        <div class="modal-card">
          <h2 class="modal-title">Game Paused</h2>
          <div class="modal-actions">
            <button id="btn-resume" class="btn-primary">▶ Resume Game</button>
            <button id="btn-pause-select-level" class="btn-secondary">▦ Choose Level</button>
            <button id="btn-pause-restart" class="btn-secondary">↺ Restart Level</button>
            <button id="btn-pause-exit" class="btn-secondary btn-exit-action">✕ Exit to Games</button>
            <!-- Commented for production:
            <button id="btn-open-customizer" class="btn-secondary">🎨 Customize & Upload Images</button>
            -->
          </div>
        </div>
      </div>

      <!-- =========================================================
           MODAL 3: LEVEL & IMAGE CUSTOMIZER (Commented for production)
           =========================================================
      <div id="customizer-modal" class="modal-overlay">
        <div class="modal-card customizer-card">
          <div class="customizer-header">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span style="font-size: 1.3rem;">🎨</span>
              <div>
                <h3 style="font-size: 1.1rem; font-weight: 800;">Level & Image Editor</h3>
                <p style="font-size: 0.78rem; color: #64748b;">Upload images & customize matching order</p>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <select id="customizer-level-select" class="item-input" style="font-weight: 700;">
                <option value="1">Quiz 1</option>
                <option value="2">Quiz 2</option>
                <option value="3">Quiz 3</option>
                <option value="4">Quiz 4</option>
                <option value="5">Quiz 5</option>
              </select>
              <button id="btn-close-customizer"
                style="background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #64748b;">&times;</button>
            </div>
          </div>

          <div class="customizer-body" id="customizer-items-container">
            <!-- Dynamic editor rows rendered here -->
  </div>
  </div>
  </div>
  -->

  </main>
  </div>

  <!-- LEVEL CONFIGURATION FILES (Requirement 2: Every level has separate file) -->
  <script src="levels/level1.js"></script>
  <script src="levels/level2.js"></script>
  <script src="levels/level3.js"></script>
  <script src="levels/level4.js"></script>
  <script src="levels/level5.js"></script>

  <!-- CORE GAME ENGINE -->
  <script src="js/game.js"></script>

</body>

</html>
