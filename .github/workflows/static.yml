# Simple workflow for deploying static content to GitHub Pages
name: Deploy + Playwright Tests

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Inject EmailJS Keys
        run: |
          sed -i "s/YOUR_EMAILJS_SERVICE_ID/${{ secrets.EMAILJS_SERVICE_ID }}/g" contact.js
          sed -i "s/YOUR_EMAILJS_TEMPLATE_ID/${{ secrets.EMAILJS_TEMPLATE_ID }}/g" contact.js
          sed -i "s/YOUR_EMAILJS_PUBLIC_KEY/${{ secrets.EMAILJS_PUBLIC_KEY }}/g" contact.js

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      # - name: Install dependencies
      #   run: npm install  # Skip if no package.json in root

      # - name: Build website
      #   run: npm run build   # Skip if static HTML

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .

  playwright-tests:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci
        working-directory: automation

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: automation

      # - name: Run Playwright Tests
      #   run: npx playwright test tests/articles.spec.js
      #   working-directory: automation
      #   env:
      #     BASE_URL: https://youtubemulti.online/

