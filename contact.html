<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | MultiTube Pro</title>
    <link rel="stylesheet" href="global.css">
    <style>
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        @media (max-width: 480px) {
            .contact-form {
                padding: 1.5rem;
            }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        textarea.form-control {
            height: 150px;
            resize: vertical;
        }

        #form-status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
        }

        #form-status.success {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            display: block;
        }

        #form-status.error {
            background: rgba(255, 0, 85, 0.1);
            color: var(--primary);
            display: block;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">MultiTube Pro</a>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="about.html">About</a>
                    <a href="contact.html" class="active">Contact</a>
                    <a href="subscription.html" class="upgrade-link">Pricing</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">
        <!-- Header Banner Ad -->
        <div class="ad-banner">
            <span class="ad-label">ADVERTISEMENT</span>
            <div id="contact-top-ad">Contact us for custom enterprise solutions.</div>
        </div>

        <div style="text-align: center; margin-bottom: 3rem;">
            <h1>Get In Touch</h1>
            <p class="text-dim">Have questions or feedback? We'd love to hear from you.</p>
        </div>

        <div class="contact-form">
            <form id="contactForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" class="form-control" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="+1 (555) 000-0000">
                </div>
                <div class="form-group">
                    <label>How can we help?</label>
                    <textarea id="message" class="form-control" required
                        placeholder="Tell us about your inquiry..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                <div id="form-status"></div>
            </form>
        </div>

        <!-- Footer Ad -->
        <div class="ad-banner" style="margin-top: 3rem;">
            <span class="ad-label">FOOTER AD</span>
            <p>Advertise with MultiTube Pro.</p>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 MultiTube Pro. All rights reserved.</p>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="subscription.html">Subscription</a>
            </div>
        </div>
    </footer>

    <script src="shared.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const status = document.getElementById('form-status');
            const btn = e.target.querySelector('button');

            btn.disabled = true;
            btn.textContent = 'Sending...';

            // Mock submission logic
            setTimeout(() => {
                status.textContent = 'Message sent successfully! We will get back to you soon.';
                status.className = 'success';
                btn.textContent = 'Message Sent';
                e.target.reset();
            }, 1000);
        });
    </script>
</body>

</html>
